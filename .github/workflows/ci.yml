name: CI

# Build the frontend and typecheck the backend on every push/PR to main.
# Hardening: all third-party actions are pinned to a full commit SHA (not a
# floating tag) to prevent tag-hijack supply-chain attacks. GITHUB_TOKEN is
# read-only by default (least privilege); no job needs write access here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: default the whole workflow to read-only. Jobs elevate only
# if they truly need to (none do in this file).
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout pinned to a full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        # actions/setup-node pinned to a full commit SHA. Caches npm downloads
        # keyed off the frontend lockfile for reproducible, faster installs.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        # npm ci performs a clean, lockfile-exact install for reproducible
        # builds. frontend/.npmrc sets legacy-peer-deps=true, so ci succeeds.
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  backend-typecheck:
    name: Backend typecheck (Cloudflare Worker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: backend
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: backend
        run: npx tsc --noEmit

